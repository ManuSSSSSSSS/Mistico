<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Venta por Encargo</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; color: #333; }
        h1 { text-align: center; margin-bottom: 30px; }
        .catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .producto { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; transition: transform 0.2s; }
        .producto:hover { transform: translateY(-5px); }
        .producto img { width: 100%; height: 250px; object-fit: cover; border-radius: 6px; }
        .precio { font-size: 1.2em; font-weight: bold; color: #2c3e50; margin: 10px 0; }
        select, button { margin-top: 10px; padding: 12px; width: 100%; border: 1px solid #ddd; border-radius: 6px; font-size: 1em; box-sizing: border-box; }
        button { background-color: #000; color: white; border: none; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        button:hover { background-color: #333; }
        .carrito { margin: 40px auto 0; max-width: 600px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .carrito ul { list-style: none; padding: 0; }
        .carrito li { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 10px 0; }
        .wpp-btn { background-color: #25D366; color: white; font-size: 1.1em; margin-top: 20px; }
        .wpp-btn:hover { background-color: #1ebe5d; }
    </style>
</head>
<body>

    <h1>Catálogo Disponible</h1>
    
    <div class="catalogo" id="catalogo"></div>

    <div class="carrito" id="seccion-carrito" style="display: none;">
        <h2>Tu Pedido</h2>
        <ul id="lista-carrito"></ul>
        <h3 style="text-align: right;">Total: $<span id="total">0</span></h3>
        <button class="wpp-btn" onclick="enviarWhatsApp()">Confirmar por WhatsApp</button>
    </div>

    <script>
        // CONFIGURACIÓN
        const NUMERO_WPP = "5491100000000"; // Tu número acá
        
        // CATÁLOGO DE PRODUCTOS (Podés ir agregando más acá)
        const productos = [
            { id: 1, nombre: "Perfume Xerjoff Soprano (Inspiración)", precio: 45000, img: "https://via.placeholder.com/250", talles: [] },
            { id: 2, nombre: "Funda Transparente Reforzada", precio: 8500, img: "https://via.placeholder.com/250", talles: ["iPhone 7", "iPhone 13", "Samsung S23"] },
            { id: 3, nombre: "Buzo Canguro", precio: 22000, img: "https://via.placeholder.com/250", talles: ["S", "M", "L", "XL"] }
        ];

        let carrito = [];

        function renderizarCatalogo() {
            const contenedor = document.getElementById("catalogo");
            productos.forEach(prod => {
                let opcionesTalle = prod.talles.length > 0 
                    ? `<select id="talle-${prod.id}">` + prod.talles.map(t => `<option value="${t}">${t}</option>`).join('') + `</select>`
                    : `<select id="talle-${prod.id}" style="display:none;"><option value="N/A">N/A</option></select>`;

                contenedor.innerHTML += `
                    <div class="producto">
                        <img src="${prod.img}" alt="${prod.nombre}">
                        <h3>${prod.nombre}</h3>
                        <p class="precio">$${prod.precio.toLocaleString('es-AR')}</p>
                        ${opcionesTalle}
                        <button onclick="agregarAlCarrito(${prod.id})">Agregar al pedido</button>
                    </div>
                `;
            });
        }

        function agregarAlCarrito(id) {
            const prod = productos.find(p => p.id === id);
            const talle = document.getElementById(`talle-${id}`).value;
            carrito.push({ nombre: prod.nombre, precio: prod.precio, talle: talle });
